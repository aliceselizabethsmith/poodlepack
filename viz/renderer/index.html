<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>PoodlePack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="scene">
    <!-- sky -->
    <div class="sun"></div>
    <div class="cloud cloud-a">☁️</div>
    <div class="cloud cloud-b">☁️</div>
    <div class="ocean"></div>
    <div class="palm palm-left">🌴</div>
    <div class="palm palm-right">🌴</div>

    <!-- header -->
    <header id="hud">
      <div class="title">Poodle<span class="dash">Pack</span> <span class="lei">🌺</span></div>
      <div id="spec" class="spec">waiting for the crew to paddle out…</div>
      <button id="mute" class="mute-btn" title="Mute / unmute music">🔊</button>
      <div id="phase" class="phase-badge">—</div>
    </header>

    <!-- the original task the crew is building, persistent under the header -->
    <div id="taskline" class="taskline"></div>

    <!-- scrolling history of the crew's conversation -->
    <div id="chatlog"></div>

    <!-- the poodle crew lives here -->
    <div id="stage"></div>

    <!-- handoff tokens fly across this layer -->
    <div id="fx"></div>

    <!-- bottom ticker -->
    <footer id="ticker"><span id="ticker-text"><svg class="pawpoodle" viewBox="0 0 110 132" aria-hidden="true"><g fill="#22222a"><ellipse cx="55" cy="108" rx="42" ry="20"/><ellipse cx="45" cy="116" rx="8" ry="12"/><ellipse cx="66" cy="116" rx="8" ry="12"/><circle cx="45" cy="124" r="9"/><circle cx="66" cy="124" r="9"/><ellipse cx="19" cy="58" rx="12" ry="19"/><ellipse cx="91" cy="58" rx="12" ry="19"/><circle cx="55" cy="40" r="30"/><circle cx="55" cy="19" r="18"/><circle cx="55" cy="90" r="30"/><circle cx="33" cy="92" r="18"/><circle cx="77" cy="92" r="18"/><circle cx="40" cy="104" r="16"/><circle cx="70" cy="104" r="16"/><circle cx="55" cy="106" r="24"/><circle cx="93" cy="84" r="11"/><circle cx="99" cy="78" r="7"/></g></svg> the pack is gathering on the beach…</span></footer>

    <!-- a poodle's question pops up here -->
    <div id="qmodal" class="hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
