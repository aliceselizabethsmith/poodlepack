<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>PoodlePack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="scene">
    <!-- sky -->
    <div class="sun"></div>
    <div class="cloud cloud-a">☁️</div>
    <div class="cloud cloud-b">☁️</div>
    <div class="ocean"></div>
    <div class="palm palm-left">🌴</div>
    <div class="palm palm-right">🌴</div>

    <!-- header -->
    <header id="hud">
      <div class="title">Poodle<span class="dash">Pack</span> <span class="lei">🌺</span></div>
      <div id="spec" class="spec">the Poodles are assembling</div>
      <button id="mute" class="mute-btn" title="Mute / unmute music">🔊</button>
      <div id="phase" class="phase-badge">—</div>
    </header>

    <!-- the original task the crew is building, persistent under the header -->
    <div id="taskline" class="taskline"></div>

    <!-- scrolling history of the crew's conversation -->
    <div id="chatlog"></div>

    <!-- the poodle crew lives here -->
    <div id="stage"></div>

    <!-- handoff tokens fly across this layer -->
    <div id="fx"></div>

    <!-- bottom ticker -->
    <footer id="ticker"><span id="ticker-text"><svg class="tickerflower" viewBox="0 0 26 26" aria-hidden="true"><ellipse cx="13" cy="6" rx="5.2" ry="7" fill="#ff4d6d" transform="rotate(0 13 13)"/><ellipse cx="13" cy="6" rx="5.2" ry="7" fill="#ff4d6d" transform="rotate(72 13 13)"/><ellipse cx="13" cy="6" rx="5.2" ry="7" fill="#ff4d6d" transform="rotate(144 13 13)"/><ellipse cx="13" cy="6" rx="5.2" ry="7" fill="#ff4d6d" transform="rotate(216 13 13)"/><ellipse cx="13" cy="6" rx="5.2" ry="7" fill="#ff4d6d" transform="rotate(288 13 13)"/><circle cx="13" cy="13" r="4" fill="#fff3c4"/><circle cx="13" cy="13" r="1.9" fill="#ffb74d"/><line x1="13" y1="13" x2="13" y2="3" stroke="#fff3c4" stroke-width="1.2"/><circle cx="13" cy="3" r="1.5" fill="#ffe08a"/></svg> the pack is gathering on the beach…</span></footer>

    <!-- a poodle's question pops up here -->
    <div id="qmodal" class="hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
