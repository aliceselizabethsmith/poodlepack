<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>PoodlePack 🌺</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="scene">
    <!-- sky -->
    <div class="sun"></div>
    <div class="cloud cloud-a">☁️</div>
    <div class="cloud cloud-b">☁️</div>
    <div class="ocean"></div>
    <div class="palm palm-left">🌴</div>
    <div class="palm palm-right">🌴</div>

    <!-- header -->
    <header id="hud">
      <div class="title">Poodle<span class="dash">Pack</span> <span class="lei">🌺</span></div>
      <div id="spec" class="spec">waiting for the crew to paddle out…</div>
      <button id="mute" class="mute-btn" title="Mute / unmute music">🔊</button>
      <div id="phase" class="phase-badge">—</div>
    </header>

    <!-- scrolling history of the crew's conversation -->
    <div id="chatlog"></div>

    <!-- the poodle crew lives here -->
    <div id="stage"></div>

    <!-- handoff tokens fly across this layer -->
    <div id="fx"></div>

    <!-- bottom ticker -->
    <footer id="ticker"><span id="ticker-text"><svg class="pawpoodle" viewBox="0 0 40 34" aria-hidden="true"><g fill="#22222a"><circle cx="20" cy="8" r="6.5"/><circle cx="20" cy="20" r="12"/><circle cx="8" cy="15" r="5.5"/><circle cx="32" cy="15" r="5.5"/><circle cx="11" cy="26" r="5"/><circle cx="29" cy="26" r="5"/></g><circle cx="15.5" cy="19" r="1.8" fill="#fff"/><circle cx="24.5" cy="19" r="1.8" fill="#fff"/><ellipse cx="20" cy="24" rx="2.2" ry="1.7" fill="#5a4a42"/></svg> the pack is gathering on the beach…</span></footer>

    <!-- a poodle's question pops up here -->
    <div id="qmodal" class="hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
